# ═══════════════════════════════════════════════════════════════════════════════
# ProcureAI — Render.com Blueprint (Infrastructure as Code)
# Automatically provisions:
# 1. PostgreSQL Managed Database (procureai-db)
# 2. Python FastAPI AI Engine (procureai-ai-service)
# 3. Node.js Express Backend API (procureai-backend)
# 4. React Vite Static Site (procureai-frontend)
# ═══════════════════════════════════════════════════════════════════════════════

databases:
  - name: procureai-db
    databaseName: procureai
    user: procureai
    plan: free
    region: oregon

services:
  # ── 1. Python FastAPI AI Evaluation & XAI Engine ───────────────────────────
  - type: web
    name: procureai-ai-service
    runtime: python
    region: oregon
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production

  # ── 2. Node.js Express Backend API ─────────────────────────────────────────
  - type: web
    name: procureai-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: procureai-db
          property: connectionString
      - key: AI_SERVICE_URL
        value: https://procureai-ai-service.onrender.com
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SEALED_BID_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"

  # ── 3. React Vite Single Page Application (Static Site) ────────────────────
  - type: web
    name: procureai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://procureai-backend.onrender.com/api/v1
